<!-- The Lift: symptom fix finder with service photo card (backed up 19 Oct 2026). Was section 5 (#services). -->
    <!-- =========================================================== 5. SERVICES: DOOR DIAGRAM + FIX FINDER -->
    <section id="services" class="pb-16 bend bend-r z-[17] bg-brand-grey-50" aria-labelledby="services-title" style="--prev:#FFFFFF">
      <div class="wrap pt-8">
        <div class="grid gap-6 lg:grid-cols-12 lg:items-end">
          <div class="reveal lg:col-span-7">
            <p class="kicker">Services &amp; fix finder</p>
            <h2 id="services-title" class="h2">What is your door doing?</h2>
          </div>
          <p class="reveal lead lg:col-span-5" style="--d:80ms">Pick a symptom to see the likely repair and how urgent it is.</p>
        </div>

        <div class="mt-10 grid gap-8 lg:mt-8 lg:grid-cols-12 lg:gap-8" data-finder>
          <!-- Symptoms -->
          <div class="lg:col-span-4">
            <div class="lg:sticky lg:top-28">
              <div class="reveal lift-hover rounded-[2rem] bg-white p-3 shadow-[0_30px_60px_-45px_rgba(28,31,42,.45)] ring-1 ring-brand-grey-200">
                <p id="sym-label" class="sr-only">Choose a symptom</p>
                <p class="sym-group"><span class="h-2 w-2 rounded-full bg-brand-red" aria-hidden="true"></span>Urgent · call now</p>
                <ul class="grid gap-1" aria-labelledby="sym-label" data-symptoms="urgent"></ul>
                <p class="sym-group mt-1 border-t border-brand-grey-100 pt-3"><span class="h-2 w-2 rounded-full bg-brand-grey-500" aria-hidden="true"></span>Book a visit</p>
                <ul class="grid gap-1" aria-label="Routine repairs" data-symptoms="routine"></ul>
              </div>
              <a href="tel:+18777877121" class="group mt-3 flex items-center gap-4 rounded-[2rem] bg-brand-red p-2.5 pr-6 lg:hidden text-white shadow-[0_20px_40px_-24px_rgba(219,0,0,.8)] transition hover:bg-brand-red-deep">
                <img src="../assets/brand/brand-mr-asap-mark.png" alt="" width="160" height="160" loading="lazy" class="h-14 w-14 shrink-0 rounded-full bg-white object-cover">
                <span class="min-w-0 leading-snug"><strong class="block font-heading">Not sure what’s wrong?</strong><span class="tnum text-sm">Call (877) 787-7121, 24/7</span></span>
                <svg class="ml-auto h-5 w-5 shrink-0 transition group-hover:translate-x-1" aria-hidden="true"><use href="#i-arrow"/></svg>
              </a>
            </div>
          </div>

          <!-- Diagram + result -->
          <div style="--d:120ms" class="reveal content-start overflow-hidden rounded-[2rem] bg-brand-grey-100 shadow-[0_50px_90px_-60px_rgba(28,31,42,.55)] ring-1 ring-brand-grey-200 lg:col-span-8 lg:grid lg:grid-cols-2 lg:content-stretch" data-stage>
            <!-- Service card: photo (or icon) of the likely repair for the chosen symptom -->
            <figure class="relative min-h-[15rem] overflow-hidden bg-brand-grey-100 sm:min-h-[18rem]" aria-live="polite" data-svc-card></figure>

            <!-- Result -->
            <div class="relative flex flex-col justify-center rounded-tr-[3.5rem] bg-brand-midnight px-5 py-5 text-white sm:px-7 sm:py-6 lg:rounded-tr-none lg:rounded-tl-[3rem]" aria-live="polite" data-result>
              <p class="text-sm text-brand-grey-400">Choose a symptom to see the likely fix.</p>
            </div>
          </div>
        </div>
      </div>
    </section>
